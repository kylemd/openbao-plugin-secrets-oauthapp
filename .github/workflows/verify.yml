name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: go

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Check formatting and generated source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go generate ./...
          git diff --exit-code

      - name: Lint scripts and Go
        shell: bash
        run: make check

      - name: Test with race detector
        shell: bash
        run: make test

      - name: Vet and scan dependencies
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          govulncheck ./...

      - name: Build Linux plugin
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o dist/openbao-plugin-secrets-oauthapp \
            ./cmd/openbao-plugin-secrets-oauthapp
          sha256sum dist/openbao-plugin-secrets-oauthapp \
            > dist/openbao-plugin-secrets-oauthapp.sha256
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg upstream "$(jq -r .upstream_commit fork-release.json)" \
            --arg revision "$(jq -r .patch_revision fork-release.json)" \
            '{repository:$repository,commit:$commit,upstream_commit:$upstream,patch_revision:$revision}' \
            > dist/source-manifest.json

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: dist/openbao-plugin-secrets-oauthapp
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oauthapp-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/openbao-plugin-secrets-oauthapp

  release:
    name: release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oauthapp-${{ github.sha }}
          path: dist

      - name: Publish compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(jq -r .release_tag fork-release.json)"
          upstream="$(jq -r .upstream_tag fork-release.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            echo "Release $tag is immutable at $target; verified main $GITHUB_SHA was not published."
            exit 0
          fi
          gh release create "$tag" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "OAuth application plugin $tag" \
            --notes "OpenBao oauthapp $upstream with explicit refresh-token credential refresh and a neutral default provider user agent. Built from the exact source commit with tests, race detection, vulnerability scanning, CodeQL, SBOM, and provenance."
