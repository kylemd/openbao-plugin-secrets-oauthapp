name: Upstream Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "29 14 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge upstream into update branch
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/openbao/openbao-plugin-secrets-oauthapp.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/upstream-main"
          git switch -C "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            exit 1
          fi
          git push --force-with-lease origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or update gated pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            url="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --label upstream-sync \
              --title "chore: sync upstream main" \
              --body "Automated upstream synchronization. Merge remains gated by formatting, lint, race tests, vet, vulnerability scanning, CodeQL, build, SBOM, and provenance.")"
            pr="$(gh pr view "$url" --json number --jq .number)"
          fi
          gh pr merge "$pr" --auto --merge --delete-branch
